<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconGradient" x1="20" y1="160" x2="160" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/> <!-- Primary Violet -->
      <stop offset="100%" stop-color="#06B6D4"/> <!-- Accent Cyan -->
    </linearGradient>
    <linearGradient id="faviconGradientGlow" x1="20" y1="160" x2="160" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  
  <!-- Outer glow effect -->
  <rect x="25" y="25" width="130" height="130" rx="30" fill="url(#faviconGradientGlow)" filter="blur(8px)"/>
  
  <!-- Main 3D cube icon -->
  <g transform="translate(90, 90)">
    <!-- Top face -->
    <path d="M0 -35L40 -15L0 5L-40 -15Z" fill="#A78BFA"/>
    <!-- Right face -->
    <path d="M0 5L40 -15V25L0 45Z" fill="#7C3AED"/>
    <!-- Left face -->
    <path d="M0 5L-40 -15V25L0 45Z" fill="#06B6D4"/>
    <!-- Front highlight -->
    <path d="M0 5L40 -15V25L0 45Z" fill="url(#faviconGradient)" opacity="0.3"/>
  </g>
</svg>
