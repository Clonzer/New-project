<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="arrowGradient" x1="90" y1="20" x2="90" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F472B6"/> <!-- Pink top -->
      <stop offset="50%" stop-color="#A855F7"/> <!-- Purple middle -->
      <stop offset="100%" stop-color="#6366F1"/> <!-- Indigo bottom -->
    </linearGradient>
