services:
  - type: web
    name: synthix
    runtime: node
    rootDir: .
    buildCommand: pnpm install --no-frozen-lockfile && pnpm run build
    startCommand: pnpm run start:backend
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NPM_CONFIG_FROZEN_LOCKFILE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PLATFORM_ACCOUNT_ID
        sync: false
    healthCheckPath: /api
